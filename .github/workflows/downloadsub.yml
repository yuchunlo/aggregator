name: Download YT Subtitles

on:
  workflow_dispatch:
  schedule:
    - cron: "0 19 * * *"

concurrency:
  group: archive-writer
  cancel-in-progress: false

permissions: {}

env:
  ARCHIVE_FILE: data/archive.json
  SUBTITLE_DIR: data/subtitles
  COOKIES_PATH: /dev/shm/cookies.txt
  MAX_ASR_TOTAL_SECONDS: 28800
  WHISPER_MODEL: base
  HF_HOME: /home/runner/.cache/huggingface

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: write
    services:
      bgutil-pot:
        image: brainicism/bgutil-ytdlp-pot-provider:2.0.0   # match requirements.txt
        ports:
          - 127.0.0.1:4416:4416

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.HF_HOME }}
          key: whisper-${{ env.WHISPER_MODEL }}

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5 (JS runtime for yt-dlp)
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Self-test
        run: python scripts/selftest.py

      - name: Load cookies
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          (umask 077; printf '%s' "$YT_COOKIES" | base64 -d > "$COOKIES_PATH")
          [ -s "$COOKIES_PATH" ] || { echo "::error::cookies file is empty after decode"; exit 1; }
          awk -F'\t' 'NF>=7 && $NF!="" {print "::add-mask::" $NF}' "$COOKIES_PATH"
          echo "cookies loaded, $(wc -l < "$COOKIES_PATH") lines"

      - name: Download subtitles
        run: |
          python scripts/download_sub.py --archive "$ARCHIVE_FILE" --output-dir "$SUBTITLE_DIR" \
            --cookies-path "$COOKIES_PATH" --max-items 400 --max-transcribe 40 \
            --max-asr-total "$MAX_ASR_TOTAL_SECONDS" --whisper-model "$WHISPER_MODEL"

      - name: Remove cookies
        if: always()
        run: rm -f "$COOKIES_PATH"

      # Summarize the subtitles just downloaded, so a video gets its summary in
      # this run instead of waiting for the next Update News run. No page fetches.
      - name: Summarize subtitles
        env:
          ITEMS_FILE: data/archive.json
          SUBTITLES_DIR: ${{ env.SUBTITLE_DIR }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: python scripts/summarize_feed.py --offline-only

      - name: Commit and push
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- data/subtitles data/archive.json
          if stray=$(git status --porcelain --untracked-files=all -- data/ | grep -v '^[MADRC] '); then
            echo "::error::Unstaged generated files under data/"; echo "$stray"; exit 1
          fi
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -q -m "chore: update subtitles"
          # The token lives only in this step's environment, never in .git/config.
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          echo "::add-mask::${auth#AUTHORIZATION: basic }"
          remote="https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="$auth" pull -q --rebase "$remote" main
          git -c http.extraheader="$auth" push -q "$remote" HEAD:main

name: Update News

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */8 * * *"

# Both workflows write data/archive.json: one queue, never cancelled midway.
concurrency:
  group: archive-writer
  cancel-in-progress: false

permissions: {}

env:
  # Line-by-line log: a job killed at its timeout keeps its last lines.
  PYTHONUNBUFFERED: "1"
  # Items whose last_seen_at is older than this many days are deleted from
  # data/archive.json (their subtitles are removed by the next downloadsub run).
  ARCHIVE_DAYS: 60
  # Scraped sources without RSS
  SCRAPED_SOURCES: "off"
  # Fallbacks after the page and the feed copy: reader (r.jina.ai, which sees
  # every url sent to it), wayback, reader-meta. Empty = none. Their effect is
  # countable in the log: `via=reader ok|miss`, `via=wayback ok|miss`.
  FALLBACKS: "reader,wayback"

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # This job needs no ASR or yt-dlp (downloadsub.yml does): skip those pins,
      # same file and versions for the rest.
      - name: Install dependencies
        run: |
          grep -vE '^(faster-whisper|yt-dlp|bgutil-ytdlp-pot-provider)[=\[]' requirements.txt > "$RUNNER_TEMP/req.txt"
          pip install -r "$RUNNER_TEMP/req.txt"

      - name: Self-test
        run: python scripts/selftest.py

      # Collect, then summarize + backfill in the same process: feed copies
      # stay in memory and never touch the disk. Tuning is all in `env`.
      - name: Aggregate and summarize
        env:
          FOLLOW_OPML_B64: ${{ secrets.FOLLOW_OPML_B64 }}
          FOLLOW_OPML_B64_2: ${{ secrets.FOLLOW_OPML_B64_2 }}
          FOLLOW_OPML_B64_3: ${{ secrets.FOLLOW_OPML_B64_3 }}
          FOLLOW_OPML_B64_4: ${{ secrets.FOLLOW_OPML_B64_4 }}
          FOLLOW_OPML_B64_5: ${{ secrets.FOLLOW_OPML_B64_5 }}
          RSS_MAX_FEEDS: ${{ vars.RSS_MAX_FEEDS || 400 }}
          MAX_ITEMS: "200"
          TIME_BUDGET_SECONDS: "5400"
          SUMMARY_RATIO: "1"
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: python scripts/collect.py

      - name: Commit and push
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- data/archive.json
          if stray=$(git status --porcelain --untracked-files=all -- data/ | grep -v '^[MADRC] '); then
            echo "::error::Unstaged generated files under data/"; echo "$stray"; exit 1
          fi
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -q -m "chore: update news snapshot"
          # The token lives only in this step's environment, never in .git/config.
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          echo "::add-mask::${auth#AUTHORIZATION: basic }"
          remote="https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="$auth" pull -q --rebase "$remote" main
          git -c http.extraheader="$auth" push -q "$remote" HEAD:main
